name: Build and Test Docker Image

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t myimage:testing --build-arg ENVIRONMENT=testing .

      - name: Run pytest
        run: docker run --name mycontainer.testing myimage:testing "python3 -m pytest"